[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signature-lead-lag"
version = "0.1.0"
description = "Path-signature lead-lag networks, spectral clustering and portfolio replication"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "pandas>=2.2,<4", "scipy>=1.13,<2", "scikit-learn>=1.5,<2", "matplotlib>=3.9,<4", "threadpoolctl>=3,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
